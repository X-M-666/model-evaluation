<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>评测报告 - 模型对决</title>
<script src="/static/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
h1{font-size:24px;color:#58a6ff;margin-bottom:6px}
.sub{color:#8b949e;font-size:14px;margin-bottom:24px}
a{color:#58a6ff;text-decoration:none}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px}
h2{font-size:17px;color:#58a6ff;margin-bottom:14px}
.winner-box{text-align:center;padding:24px}
.winner-box .label{color:#8b949e;font-size:14px}
.winner-box .score{font-size:44px;font-weight:bold;color:#f0883e}
.winner-box .vs{color:#8b949e;margin:8px 0;font-size:18px}
.winner-box .detail{font-size:13px;color:#8b949e;margin-top:8px;line-height:1.7}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.stat-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;text-align:center}
.stat-box .v{font-size:24px;font-weight:bold;color:#58a6ff}
.stat-box .k{font-size:12px;color:#8b949e;margin-top:4px}
.stat-box.win .v{color:#3fb950}
.stat-box.lose .v{color:#f85149}
.chart{width:100%;height:380px}
.chart-sm{width:100%;height:320px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid #21262d;text-align:left}
th{color:#8b949e;font-weight:normal;font-size:12px}
td{color:#c9d1d9}
.winner-cell{color:#3fb950;font-weight:bold}
.loser-cell{color:#f85149}
.tie-cell{color:#8b949e}
.basis{font-size:13px;color:#8b949e;margin-top:4px;line-height:1.6}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
.tag.w{background:#238636;color:#fff}
.tag.l{background:#da3633;color:#fff}
.tag.t{background:#30363d;color:#8b949e}
.analysis-section{margin-bottom:18px}
.analysis-section h3{font-size:15px;color:#f0883e;margin-bottom:8px}
.analysis-section p{font-size:13.5px;color:#c9d1d9;line-height:1.8;margin-bottom:6px}
.loading{text-align:center;padding:60px;color:#8b949e}
.chart-card{min-height:420px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>📊 评测报告</h1>
<p class="sub" id="subInfo">加载中...</p>
<div style="margin:8px 0 12px" id="exportBar" style="display:none">
  <button id="exportBtn" style="padding:8px 16px;background:#238636;color:#fff;border:none;border-radius:6px;cursor:pointer">⬇ 导出评测包（zip）</button>
  <a href="#" id="badcaseLink" style="display:none;padding:8px 16px;background:#8957e5;color:#fff;border-radius:6px;text-decoration:none;margin-left:10px">🕵️ Bad Case（<span id="badcaseCount">0</span>）</a>
</div>
<div style="margin-bottom:16px">
<a href="/">← 返回配置</a>
<span style="margin:0 8px;color:#30363d">|</span>
<a href="#" id="exportJsonLink">导出 JSON</a>
</div>

<div class="card winner-box" id="winnerCard"></div>
<div class="card" id="statCard"></div>

<div class="two-col">
  <div class="card chart-card"><h2>逐题得分对比（分组柱状图）</h2><div id="chartScore" class="chart"></div></div>
  <div class="card chart-card"><h2>维度聚合得分（雷达图）</h2><div id="chartDim" class="chart"></div></div>
</div>

<div class="two-col">
  <div class="card chart-card"><h2>响应延迟对比（ms）</h2><div id="chartLatency" class="chart"></div></div>
  <div class="card chart-card"><h2>Token 消耗构成（堆叠柱状图）</h2><div id="chartTokens" class="chart"></div></div>
</div>

<div class="two-col">
  <div class="card chart-card" id="codeCard"><h2>代码题沙箱通过率</h2><div id="chartCode" class="chart-sm"></div></div>
  <div class="card chart-card"><h2>效率-成本权衡（散点图，气泡=得分）</h2><div id="chartScatter" class="chart"></div></div>
</div>

<div class="two-col">
  <div class="card chart-card"><h2>胜场分布</h2><div id="chartWin" class="chart-sm"></div></div>
  <div class="card chart-card" id="stabilityCard" style="display:none"><h2>跨轮稳定性（均值±标准差）</h2><div id="chartStability" class="chart"></div></div>
</div>

<div class="card" id="analysisCard">
<h2>精确分析（规则化统计）</h2>
<div id="analysisBody"></div>
</div>

<div class="card" id="groundingCard" style="display:none"></div>
<div class="card" id="badcaseCard" style="display:none"></div>

<div class="card" id="metaEvalCard" style="display:none"></div>
<div class="card" id="consistencyCard" style="display:none"></div>

<div class="card">
<h2>逐题评分明细</h2>
<table id="scoreTable">
<thead><tr><th>题目</th><th>维度</th><th>答案X</th><th>答案Y</th><th>胜方</th><th>依据</th></tr></thead>
<tbody id="scoreBody"></tbody>
</table>
</div>

<div class="card">
<h2>答卷详情</h2>
<div id="ansRounds"></div>
</div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const jobId = params.get('job');
const C = {x:'#58a6ff', y:'#f0883e'};

function getToken(){ return localStorage.getItem('duel_token') || ''; }
async function apiFetch(url, opts={}){
  const headers = Object.assign({}, opts.headers);
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if(r.status === 401){
    throw new Error('未授权：请在首页顶部设置访问令牌');
  }
  return r;
}

if(!jobId){
  document.querySelector('.wrap').innerHTML='<div class="loading">缺少 job 参数，<a href="/">返回首页</a></div>';
}else{
  loadReport();
}

async function loadReport(){
  try{
    const r = await apiFetch(`/api/eval/${jobId}/report`);
    if(!r.ok) throw new Error('报告未找到或尚未完成');
    const data = await r.json();
    renderReport(data);
  }catch(e){
    try{
      const r2 = await apiFetch(`/api/eval/${jobId}/status`);
      const s = await r2.json();
      if(s.state==='reviewing'){
        document.querySelector('.wrap').innerHTML=`<div class="loading">该评测等待人工评审，<a href="/review.html?job=${esc(jobId)}">立即去评审 →</a></div>`;
        return;
      }
      if(s.state!=='completed'){
        document.querySelector('.wrap').innerHTML=`<div class="loading">评测进行中（${esc(s.state)}），请稍后刷新</div>`;
        return;
      }
    }catch(_){}
    document.querySelector('.wrap').innerHTML=`<div class="loading">加载失败: ${esc(e)}，<a href="/">返回首页</a></div>`;
  }
}

function renderReport(data){
  const v = data.verdict || {};
  const cfg = data.config || {};
  const tasks = data.tasks?.tasks || [];
  const rep = data.report || null;
  const s = rep ? rep.summary : null;
  const ma = cfg.model_a?.name || '?';
  const mb = cfg.model_b?.name || '?';
  const dsName = cfg.dataset_name || null;
  const repeatN = cfg.repeat_n || 1;

  const modeText = rep?.review?.mode === 'pure_agent' ? 'AI 自动评审'
    : rep?.review?.mode === 'hybrid' ? `Hybrid（AI 预评 + 人工复核 Top-${rep.review.k_top_human ?? '?'}）`
    : '人工双盲';
  let subText = `${ma} vs ${mb} | 任务集: ${tasks.length} 题 | 评审: ${modeText} | jobId: ${jobId}`;
  if(rep?.review?.degraded) subText += ' | ⚠ 已降级为人工评审';
  if(dsName) subText += ` | 评测集: ${dsName}`;
  if(repeatN > 1) subText += ` | 重复 ${repeatN} 次取平均`;
  if(cfg.seed != null) subText += ` | seed=${cfg.seed}`;
  document.getElementById('subInfo').textContent = subText;

  const xLabel = s ? s.x_model : (v.revealed?.answer_x || '答案X');
  const yLabel = s ? s.y_model : (v.revealed?.answer_y || '答案Y');
  const totalX = s ? s.total_x : (v.totals?.answer_x || 0);
  const totalY = s ? s.total_y : (v.totals?.answer_y || 0);

  const winner = totalX > totalY ? xLabel : totalY > totalX ? yLabel : '平局';
  document.getElementById('winnerCard').innerHTML = `
    <div class="label">胜方</div>
    <div class="score">${esc(winner)}</div>
    <div class="vs">${fmt(totalX)} : ${fmt(totalY)}</div>
    <div class="detail">答案X = ${esc(xLabel)}&nbsp;&nbsp;|&nbsp;&nbsp;答案Y = ${esc(yLabel)}</div>
  `;

  if(s){
    const stats = [
      {k:'满分', v:fmt(s.max_score)},
      {k:'答案X 总分', v:fmt(s.total_x), c:s.winner==='answer_x'?'win':(s.winner==='answer_y'?'lose':'')},
      {k:'答案Y 总分', v:fmt(s.total_y), c:s.winner==='answer_y'?'win':(s.winner==='answer_x'?'lose':'')},
      {k:'平均分 X/Y', v:fmt(s.avg_x)+' / '+fmt(s.avg_y)},
      {k:'胜场 X/Y/平', v:`${s.win_x}/${s.win_y}/${s.ties}`},
      {k:'评测轮次', v:repeatN},
    ];
    document.getElementById('statCard').innerHTML = `<h2>核心指标</h2><div class="stat-grid">${stats.map(st=>`<div class="stat-box ${st.c||''}"><div class="v">${st.v}</div><div class="k">${st.k}</div></div>`).join('')}</div>`;
    renderCharts(rep);
    renderAnalysis(rep.analysis || []);
    renderMetaEval(rep);
    renderConsistency(rep);
    renderGrounding(rep);
    renderBadcases();
  }else{
    document.getElementById('statCard').style.display='none';
    document.querySelectorAll('.chart-card').forEach(c=>c.style.display='none');
    document.getElementById('analysisCard').style.display='none';
  }

  renderScoreTable(v, data.round_scores);
  renderAnswers(data);
}

// ---- 元评估（金标）段（迭代三） ----
function renderMetaEval(rep){
  const el = document.getElementById('metaEvalCard');
  const m = rep?.meta_eval;
  if(!m){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  if(!m.available){
    el.innerHTML = `<h2>元评估（金标）</h2><p class="hint" style="color:#8b949e;font-size:13px">${esc(m.note||'未配置金标集')}</p>`;
    return;
  }
  const src = m.gold_source ? `<span class="badge dim">来源：${esc(m.gold_source)}</span>` : '';
  const rows = [
    {k:'Spearman（评审 vs 金标）', v: m.spearman != null ? String(m.spearman) : '样本不足'},
    {k:'Kappa（胜负一致）', v: m.kappa != null ? String(m.kappa) : '样本不足'},
    {k:'平均分偏移（评审×10 减金标）', v: m.gold_offset != null ? String(m.gold_offset) : '—'},
    {k:'匹配题数', v: `${m.matched}/${m.gold_total}`},
  ];
  el.innerHTML = `<h2>元评估（金标） ${src}</h2>
    <div class="meta-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:10px">
      ${rows.map(r=>`<div class="stat-box"><div class="v">${esc(r.v)}</div><div class="k">${esc(r.k)}</div></div>`).join('')}
    </div>
    ${m.note ? `<p class="hint" style="color:#8b949e;font-size:12px;margin-top:8px">${esc(m.note)}</p>` : ''}`;
}

// ---- 复评一致率段（迭代三，repeat_n≥2） ----
function renderConsistency(rep){
  const el = document.getElementById('consistencyCard');
  const c = rep?.consistency;
  if(!c){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  const perRows = Object.entries(c.per_task||{}).map(([tid, v])=>`
    <tr><td>${esc(tid)}</td><td>${esc((v.rounds||[]).join(' / '))}</td><td>${v.rate == null ? '—' : (v.rate*100).toFixed(0)+'%'}</td></tr>`).join('');
  el.innerHTML = `<h2>复评一致率（${c.repeat_n} 轮）</h2>
    <p style="font-size:20px;font-weight:bold;color:${c.overall == null ? '#8b949e' : (c.overall >= 0.8 ? '#3fb950' : c.overall >= 0.5 ? '#f0883e' : '#f85149')}">${c.overall == null ? '—' : (c.overall*100).toFixed(0)+'%'}</p>
    <p class="hint" style="color:#8b949e;font-size:12px;margin-top:4px">${esc(c.note||'')}</p>
    <table style="width:100%;margin-top:10px;font-size:13px;border-collapse:collapse">
      <tr style="color:#8b949e;text-align:left"><th style="padding:4px 6px">题目</th><th style="padding:4px 6px">逐轮胜方（稳定空间）</th><th style="padding:4px 6px">一致率</th></tr>
      ${perRows || '<tr><td colspan="3" style="color:#8b949e">无逐题数据</td></tr>'}
    </table>`;
}

// ---- Bad Case 概览（迭代五） ----
async function renderBadcases(){
  const link = document.getElementById('badcaseLink');
  try{
    const r = await apiFetch(`/api/badcases/stats?job_id=${jobId}`);
    const s = await r.json();
    document.getElementById('badcaseCount').textContent = s.total || 0;
    if(s.total > 0){
      link.style.display = 'inline-block';
      link.href = `/badcases.html?job=${jobId}`;
      const el = document.getElementById('badcaseCard');
      el.style.display = 'block';
      const catColor = {事实错误:'#f0883e', 语义错误:'#58a6ff', 推理错误:'#8957e5', 安全偏见输出:'#f85149', 执行错误:'#3fb950', 未归类:'#8b949e'};
      const topCat = Object.entries(s.by_category||{}).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([k,v])=>`<span class="badge" style="background:${catColor[k]||'#30363d'}">${esc(k)} ${v}</span>`).join(' ');
      el.innerHTML = `<h2>🕵️ Bad Case 概览</h2>
        <p style="font-size:13px;color:#c9d1d9">本评测自动产出 <strong>${s.total}</strong> 条 bad case（已确认 ${s.confirmed}），分类 top：${topCat || '—'}</p>
        <a href="/badcases.html?job=${jobId}" style="font-size:13px">进入 Bad Case 库 →</a>`;
    }
  }catch(_){ /* 无数据/失败静默 */ }
}

// ---- RAG 忠实性段（迭代四，带 context 的题目） ----
function renderGrounding(rep){
  const el = document.getElementById('groundingCard');
  const g = rep?.metrics?.grounding;
  if(!g){ el.style.display = 'none'; return; }
  el.style.display = 'block';
  const fmtPct = n => n == null ? '—' : (n*100).toFixed(0)+'%';
  const side = (label, col, s) => {
    const c = s || {};
    const f = c.faithfulness, r = c.answer_relevancy;
    const grounded = c.grounded ? '<span style="color:#3fb950">✔ 有据</span>'
      : (c.reason === 'no_answer' ? '<span style="color:#f85149">无回答</span>'
         : '<span style="color:#f85149">⚠ 无据/低支持</span>');
    return `<tr><td>${label}</td><td style="color:${col}">${fmtPct(f)}</td><td>${fmtPct(r)}</td><td>${grounded}</td></tr>`;
  };
  const rows = (rep.metrics.per_task||[]).filter(t=>t.grounding).map(t=>`
    <tr><td style="color:#c9d1d9">${esc(t.id)}</td>
      ${side('答案X', '#58a6ff', t.grounding.x)}
      ${side('答案Y', '#f0883e', t.grounding.y)}
    </tr>`).join('');
  el.innerHTML = `<h2>RAG 忠实性（grounding，${g.context_tasks} 题带参考文档）</h2>
    <p class="hint" style="color:#8b949e;font-size:12px;margin:4px 0 8px">忠实度=答案与参考文档的 n-gram 相似度；≥${(g.threshold*100).toFixed(0)}% 判为有据。X 侧有据 ${g.grounded_x}/${g.context_tasks}，Y 侧有据 ${g.grounded_y}/${g.context_tasks}</p>
    <table style="width:100%;font-size:13px;border-collapse:collapse">
      <tr style="color:#8b949e;text-align:left"><th style="padding:4px 6px">题目</th><th style="padding:4px 6px">侧</th><th style="padding:4px 6px">忠实度</th><th style="padding:4px 6px">相关性</th><th style="padding:4px 6px">判定</th></tr>
      ${rows}
    </table>`;
}

// ---- 导出评测包（迭代四） ----
async function exportZip(){
  const token = getToken();
  const headers = {};
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(`/api/eval/${jobId}/export`, {headers});
  if(!r.ok){
    const t = await r.text().catch(()=> '');
    alert('导出失败：' + (t || r.status));
    return;
  }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `eval-${jobId}.zip`;
  a.click();
  URL.revokeObjectURL(a.href);
}
document.addEventListener('DOMContentLoaded', () => {
  const b = document.getElementById('exportBtn');
  if(b) b.addEventListener('click', exportZip);
});

function renderCharts(rep){
  const ch = rep.charts || {};
  const s = rep.summary || {};

  const baseOpt = (legend, xAxisName, yAxisName) => ({
    tooltip:{trigger:'axis',renderMode:'richText'},
    legend:{data:legend,textStyle:{color:'#c9d1d9'},top:0},
    grid:{left:50,right:20,top:36,bottom:40},
    xAxis:{type:'category',data:[],axisLabel:{color:'#8b949e'},axisLine:{lineStyle:{color:'#30363d'}}},
    yAxis:{type:'value',name:yAxisName||'',nameTextStyle:{color:'#8b949e'},axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}}},
    color:['#58a6ff','#f0883e'],
  });

  // 1. 逐题得分
  if(ch.score_by_question){
    const d = ch.score_by_question;
    const o = baseOpt(['答案X','答案Y'],'','得分');
    o.xAxis.data = d.categories;
    o.yAxis.max = 10;
    o.series = [
      {name:'答案X',type:'bar',data:d.x,itemStyle:{color:C.x},barMaxWidth:28},
      {name:'答案Y',type:'bar',data:d.y,itemStyle:{color:C.y},barMaxWidth:28},
    ];
    echarts.init(document.getElementById('chartScore')).setOption(o);
  }

  // 2. 维度聚合（≥3 维度用雷达图，否则分组柱状）
  if(ch.score_by_dimension){
    const d = ch.score_by_dimension;
    if(d.dimensions.length >= 3){
      const el = document.getElementById('chartDim');
      el.parentElement.querySelector('h2').textContent = '维度聚合得分（雷达图）';
      echarts.init(el).setOption({
        tooltip:{renderMode:'richText'},
        legend:{data:['答案X','答案Y'],textStyle:{color:'#c9d1d9'},top:0},
        radar:{
          indicator:d.dimensions.map(name=>({name,max:Math.max(...d.x,...d.y,10)})),
          shape:'circle',axisName:{color:'#8b949e',fontSize:12},
          splitArea:{areaStyle:{color:['#161b22','#1c2128']}},
          splitLine:{lineStyle:{color:'#30363d'}},axisLine:{lineStyle:{color:'#30363d'}},
        },
        series:[{
          type:'radar',
          data:[
            {value:d.x,name:'答案X',lineStyle:{color:C.x},areaStyle:{color:'rgba(88,166,255,0.15)'},itemStyle:{color:C.x}},
            {value:d.y,name:'答案Y',lineStyle:{color:C.y},areaStyle:{color:'rgba(240,136,62,0.15)'},itemStyle:{color:C.y}},
          ],
        }],
      });
    }else{
      const el = document.getElementById('chartDim');
      el.parentElement.querySelector('h2').textContent = '维度聚合得分（分组柱状图）';
      const o = baseOpt(['答案X','答案Y'],'','维度总分');
      o.xAxis.data = d.dimensions;
      o.series = [
        {name:'答案X',type:'bar',data:d.x,itemStyle:{color:C.x},barMaxWidth:36},
        {name:'答案Y',type:'bar',data:d.y,itemStyle:{color:C.y},barMaxWidth:36},
      ];
      echarts.init(el).setOption(o);
    }
  }

  // 3. 延迟
  if(ch.latency_by_question){
    const d = ch.latency_by_question;
    const o = baseOpt(['答案X','答案Y'],'','毫秒');
    o.xAxis.data = d.categories;
    o.series = [
      {name:'答案X',type:'bar',data:d.x,itemStyle:{color:C.x},barMaxWidth:28},
      {name:'答案Y',type:'bar',data:d.y,itemStyle:{color:C.y},barMaxWidth:28},
    ];
    echarts.init(document.getElementById('chartLatency')).setOption(o);
  }

  // 4. Token 堆叠
  if(ch.tokens_by_question){
    const d = ch.tokens_by_question;
    const o = baseOpt(['X-prompt','X-completion','Y-prompt','Y-completion'],'','tokens');
    o.xAxis.data = d.categories;
    o.series = [
      {name:'X-prompt',type:'bar',stack:'X',data:d.x_prompt,itemStyle:{color:'#1f6feb'},barMaxWidth:30},
      {name:'X-completion',type:'bar',stack:'X',data:d.x_completion,itemStyle:{color:'#58a6ff'},barMaxWidth:30},
      {name:'Y-prompt',type:'bar',stack:'Y',data:d.y_prompt,itemStyle:{color:'#b15e3c'},barMaxWidth:30},
      {name:'Y-completion',type:'bar',stack:'Y',data:d.y_completion,itemStyle:{color:'#f0883e'},barMaxWidth:30},
    ];
    echarts.init(document.getElementById('chartTokens')).setOption(o);
  }

  // 5. 代码通过率
  if(ch.code_pass_rate && ch.code_pass_rate.length){
    const d = ch.code_pass_rate;
    const cats = d.map(q=>q.id);
    const xP = d.map(q=>q.x_passed), xT = d.map(q=>q.x_total);
    const yP = d.map(q=>q.y_passed), yT = d.map(q=>q.y_total);
    echarts.init(document.getElementById('chartCode')).setOption({
      tooltip:{trigger:'axis',renderMode:'richText',formatter:ps=>{
        const q = d[ps[0].dataIndex];
        return `${q.id}<br/>答案X 通过: ${q.x_passed}/${q.x_total}<br/>答案Y 通过: ${q.y_passed}/${q.y_total}`;
      }},
      legend:{data:['答案X 通过','答案X 未通过','答案Y 通过','答案Y 未通过'],textStyle:{color:'#c9d1d9'},top:0},
      grid:{left:50,right:20,top:36,bottom:40},
      xAxis:{type:'value',max:1,axisLabel:{color:'#8b949e',formatter:v=>v+'×'},splitLine:{lineStyle:{color:'#21262d'}}},
      yAxis:{type:'category',data:cats,axisLabel:{color:'#8b949e'},axisLine:{lineStyle:{color:'#30363d'}}},
      series:[
        {name:'答案X 通过',type:'bar',stack:'x',data:xP.map((p,i)=>({value: xT[i]? p/xT[i]:0})),itemStyle:{color:'#3fb950'}},
        {name:'答案X 未通过',type:'bar',stack:'x',data:xP.map((p,i)=>({value: xT[i]? (xT[i]-p)/xT[i]:0})),itemStyle:{color:'#da3633'}},
        {name:'答案Y 通过',type:'bar',stack:'y',data:yP.map((p,i)=>({value: yT[i]? p/yT[i]:0})),itemStyle:{color:'#2ea043'}},
        {name:'答案Y 未通过',type:'bar',stack:'y',data:yP.map((p,i)=>({value: yT[i]? (yT[i]-p)/yT[i]:0})),itemStyle:{color:'#f85149'}},
      ],
    });
  }else{
    document.getElementById('codeCard').style.display='none';
  }

  // 6. 效率散点
  if(ch.efficiency_scatter){
    const d = ch.efficiency_scatter;
    const mk = (pts, name, color) => ({
      name, type:'scatter',
      symbolSize: v => 8 + v[2] * 3,
      itemStyle:{color},
      data: pts.map(p=>[p.latency_ms, p.completion_tokens, p.score, p.name]),
    });
    echarts.init(document.getElementById('chartScatter')).setOption({
      tooltip:{renderMode:'richText',formatter: p=>{
        const d2 = p.data;
        return `${d2[3]}: ${d2[0]} ms · ${d2[1]} tokens · 得分 ${d2[2]}`;
      }},
      legend:{data:['答案X','答案Y'],textStyle:{color:'#c9d1d9'},top:0},
      grid:{left:60,right:20,top:36,bottom:45},
      xAxis:{type:'value',name:'延迟(ms)',nameTextStyle:{color:'#8b949e'},axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}}},
      yAxis:{type:'value',name:'输出 tokens',nameTextStyle:{color:'#8b949e'},axisLabel:{color:'#8b949e'},splitLine:{lineStyle:{color:'#21262d'}}},
      series:[mk(d.x_points,'答案X',C.x), mk(d.y_points,'答案Y',C.y)],
    });
  }

  // 7. 胜场分布
  if(ch.win_distribution){
    const d = ch.win_distribution;
    const total = d.win_x + d.win_y + d.ties;
    echarts.init(document.getElementById('chartWin')).setOption({
      tooltip:{trigger:'item',renderMode:'richText',formatter:'{b}: {c} 题 ({d}%)'},
      legend:{textStyle:{color:'#c9d1d9'},bottom:0},
      series:[{
        type:'pie',radius:['40%','68%'],center:['50%','45%'],
        label:{color:'#c9d1d9',formatter:'{b}: {c}'},
        data:[
          {value:d.win_x,name:'答案X 胜',itemStyle:{color:C.x}},
          {value:d.win_y,name:'答案Y 胜',itemStyle:{color:C.y}},
          {value:d.ties,name:'平局',itemStyle:{color:'#8b949e'}},
        ],
      }],
    });
  }

  // 8. 稳定性（repeat>1）
  if(ch.stability){
    document.getElementById('stabilityCard').style.display='block';
    const d = ch.stability;
    const o = baseOpt(['答案X','答案Y'],'','平均分');
    o.xAxis.data = d.categories;
    o.yAxis.max = 10;
    o.series = [
      {name:'答案X',type:'bar',data:d.x.map((v,i)=>({value:v,itemStyle:{color:C.x}})),barMaxWidth:24},
      {name:'答案Y',type:'bar',data:d.y.map((v,i)=>({value:v,itemStyle:{color:C.y}})),barMaxWidth:24},
      {name:'X 标准差',type:'scatter',symbol:'diamond',symbolSize:10,itemStyle:{color:'#fff'},data:d.x_std.map((v,i)=>[i,v])},
      {name:'Y 标准差',type:'scatter',symbol:'diamond',symbolSize:10,itemStyle:{color:'#000'},data:d.y_std.map((v,i)=>[i,v])},
    ];
    echarts.init(document.getElementById('chartStability')).setOption(o);
  }
}

function renderAnalysis(sections){
  if(!sections || !sections.length){
    document.getElementById('analysisBody').innerHTML='<p style="color:#8b949e">无分析数据</p>';
    return;
  }
  document.getElementById('analysisBody').innerHTML = sections.map(sec=>`
    <div class="analysis-section"><h3>${esc(sec.title)}</h3>${sec.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}</div>
  `).join('');
}

function renderAnswers(data){
  const rounds = data.rounds;
  const box = document.getElementById('ansRounds');
  const ansText = (ans, label) => {
    const rows = (ans && ans.answers) ? ans.answers : [];
    const meta = a => {
      const api = a.api_info || {};
      const bits = [];
      if(api.latency_ms) bits.push(api.latency_ms + ' ms');
      if(api.prompt_tokens != null || api.completion_tokens != null) bits.push(`tokens ${api.prompt_tokens||0}+${api.completion_tokens||0}`);
      if(api.status && api.status !== 'ok') bits.push('状态:' + api.status);
      if(a.code_verify && a.code_verify.status === 'run') bits.push(`代码通过 ${a.code_verify.passed}/${a.code_verify.total}`);
      return bits.length ? `<div class="basis">${esc(bits.join(' · '))}</div>` : '';
    };
    return rows.map(a=>`<pre style="white-space:pre-wrap;font-size:13px;margin-top:10px;color:#8b949e">[${esc(a.id)}]${meta(a)}\n${esc(a.raw_answer||'(无回答)')}</pre>`).join('\n') || '<div class="basis">无数据</div>';
  };
  if(rounds && rounds.length){
    box.innerHTML = rounds.map(r=>`
      <details${rounds.length>1?'':''}>
        <summary style="cursor:pointer;color:#8b949e;margin-top:8px">第 ${r.round} 轮 · 答案X 原文（${esc(r.answers_x?.model||'答案X')}）</summary>
        ${ansText(r.answers_x)}
      </details>
      <details${rounds.length>1?'':''}>
        <summary style="cursor:pointer;color:#8b949e;margin-top:8px">第 ${r.round} 轮 · 答案Y 原文（${esc(r.answers_y?.model||'答案Y')}）</summary>
        ${ansText(r.answers_y)}
      </details>
    `).join('');
    return;
  }
  // 旧响应无 rounds 字段时兜底 A/B
  const ansX = data.answers_x || data.answers_a || {};
  const ansY = data.answers_y || data.answers_b || {};
  box.innerHTML = `
    <details><summary style="cursor:pointer;color:#8b949e">展开答案X 原文</summary>${ansText(ansX)}</details>
    <details><summary style="cursor:pointer;color:#8b949e;margin-top:8px">展开答案Y 原文</summary>${ansText(ansY)}</details>`;
}

function renderScoreTable(v, roundScores){
  const scores = v.scores || [];
  const isAvg = v.meta?.repeat_n > 1;
  const hasRoundDetail = Array.isArray(roundScores) && roundScores.length > 1;
  const tbody = document.getElementById('scoreBody');
  tbody.innerHTML = scores.map(s=>{
    const winnerTag = s.winner==='tie'?'<span class="tag t">平</span>':
      s.winner==='answer_x'?'<span class="tag w">X胜</span>':'<span class="tag l">Y胜</span>';
    const xClass = s.winner==='answer_x'?'winner-cell':s.winner==='answer_y'?'loser-cell':'tie-cell';
    const yClass = s.winner==='answer_y'?'winner-cell':s.winner==='answer_x'?'loser-cell':'tie-cell';
    const fmtS = (sc, sd, md) => {
      let t = `${sc}/10`;
      if(isAvg && sd) t += `<sup style="color:#8b949e">±${sd}</sup>`;
      if(isAvg && md != null) t += `<span style="font-size:11px;color:#8b949e"> 中位 ${md}</span>`;
      return t;
    };
    const roundLines = hasRoundDetail ? roundScores.map(rs=>{
      const rsx = (rs.scores||[]).find(x=>x.id===s.id);
      if(!rsx) return '';
      const wTag = rsx.winner==='tie'?'平':rsx.winner==='answer_x'?'X胜':'Y胜';
      return `<div class="basis">第 ${rs.round} 轮：X ${rsx.answer_x} 分 / Y ${rsx.answer_y} 分（${wTag}）</div>`;
    }).join('') : '';
    return `<tr>
      <td><strong>${esc(s.id)}</strong></td>
      <td>${esc(s.dimension)}</td>
      <td class="${xClass}">${fmtS(s.answer_x, s.answer_x_std, s.answer_x_median)}</td>
      <td class="${yClass}">${fmtS(s.answer_y, s.answer_y_std, s.answer_y_median)}</td>
      <td>${winnerTag}</td>
      <td><details><summary style="cursor:pointer;color:#8b949e">展开</summary><div class="basis">${esc(s.basis||'')}</div>${roundLines}</details></td>
    </tr>`;
  }).join('');
}

function fmt(n){ return Math.round(n*100)/100; }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function exportJson(){
  try{
    const r = await apiFetch(`/api/eval/${jobId}/report`);
    const data = await r.json();
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `eval-${jobId}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){
    alert('导出失败: '+e);
  }
}

const exportLink = document.getElementById('exportJsonLink');
if(exportLink) exportLink.addEventListener('click', e=>{
  e.preventDefault();
  exportJson();
});
</script>
