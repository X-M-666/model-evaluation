<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Bad Case 库</title>
<link rel="stylesheet" href="/static/common.css">
<style>
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,'Segoe UI',sans-serif;margin:0}
.wrap{max-width:960px;margin:0 auto;padding:24px}
h1{font-size:22px;color:#f0f6fc}
h2{font-size:15px;color:#f0883e;margin-bottom:8px}
.sub{color:#8b949e;font-size:13px;margin-top:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-top:16px}
.hint{color:#8b949e;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;background:#30363d}
.badge.dim{background:#1f6feb;color:#fff}
.badge.lm{background:#8957e5;color:#fff}
.badge.hm{background:#238636;color:#fff}
.badge.no{background:#da3633;color:#fff}
.badge.warn{background:#f0883e;color:#0d1117}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.filters select,.filters input{padding:6px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn{background:#1f6feb;color:#fff}
.btn-ok{background:#238636;color:#fff}
.btn-no{background:#da3633;color:#fff}
.btn-ghost{background:#30363d;color:#c9d1d9}
.case{border:1px solid #21262d;border-radius:8px;padding:14px;margin-top:12px;background:#0d1117}
.case h3{margin:0 0 6px;font-size:14px;color:#f0f6fc}
.meta{font-size:12px;color:#8b949e}
.sources span{margin-right:8px}
.attr{margin-top:10px;padding:10px;background:#10161f;border-left:3px solid #8957e5;border-radius:0 6px 6px 0;font-size:13px}
.attr .basis{color:#8b949e;margin-top:4px;white-space:pre-wrap}
.attr select{padding:5px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px}
.attr input[type=text]{width:100%;margin-top:6px;padding:6px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
.chart{height:260px}
a{color:#58a6ff}
.loading{text-align:center;padding:60px;color:#8b949e}
.empty{text-align:center;padding:40px;color:#8b949e}
</style>
<script src="/static/echarts.min.js"></script>
</head>
<body>
<div class="wrap">
<h1>🕵️ Bad Case 库</h1>
<p class="sub" id="subInfo">加载中...</p>
<div class="card">
<h2>筛选与统计</h2>
<div class="filters">
  <label class="hint">评测 job：<input id="f-job" placeholder="留空=全部" style="width:220px"></label>
  <label class="hint">分类：
    <select id="f-cat"><option value="">全部</option></select>
  </label>
  <label class="hint">确认态：
    <select id="f-conf"><option value="">全部</option><option value="0">待确认</option><option value="1">已确认</option></select>
  </label>
  <button class="btn" id="applyBtn">应用筛选</button>
  <button class="btn-ghost" id="exportBtn">导出 JSON</button>
  <span class="hint" id="statLine"></span>
</div>
<div class="charts">
  <div class="card" style="margin-top:12px"><h2>错误类别分布</h2><div id="chartCat" class="chart"></div></div>
  <div class="card" style="margin-top:12px"><h2>挖掘来源分布</h2><div id="chartSrc" class="chart"></div></div>
</div>
</div>
<div class="card" id="listCard">
<h2>Bad Case 列表</h2>
<div id="list"><div class="loading">加载中...</div></div>
</div>
</div>
<script src="/static/common.js"></script>
<script>
CD.renderTopNav('badcase');
const esc = s => CD.esc(s);
function getToken(){ return CD.getToken(); }
async function apiFetch(url, opts={}){ return CD.apiFetch(url, opts); }
const CAT_COLORS = {事实错误:'#f0883e', 语义错误:'#58a6ff', 推理错误:'#8957e5', 安全偏见输出:'#f85149', 执行错误:'#3fb950', 未归类:'#8b949e'};
const SRC_LABELS = {low_score:'低分', dual_fail:'双败', disagreement:'评审分歧', edge_safety:'安全边缘', edge_grounding:'RAG 不忠实', edge_code:'代码未全过'};
let JOBS = {};
let STATS = null;

function filterQuery(){
  const p = new URLSearchParams();
  const job = document.getElementById('f-job').value.trim();
  const cat = document.getElementById('f-cat').value;
  const conf = document.getElementById('f-conf').value;
  if(job) p.set('job_id', job);
  if(cat) p.set('category', cat);
  if(conf !== '') p.set('confirmed', conf);
  return p.toString();
}
function sourceBadges(sources){
  return (sources||[]).map(s=>`<span class="badge warn">${esc(SRC_LABELS[s]||s)}</span>`).join('');
}
function attrBlock(c){
  const a = c.attribution || {};
  const by = a.by === 'human' ? '<span class="badge hm">人工</span>' : (a.by === 'llm' ? '<span class="badge lm">LLM</span>' : '<span class="badge no">未归因</span>');
  const sel = CATS.map(cat=>`<option value="${esc(cat)}" ${a.label===cat?'selected':''}>${esc(cat)}</option>`).join('');
  return `<div class="attr" data-id="${esc(c.case_id)}">
    <strong>归因：</strong>${by} ${a.confirmed ? '<span class="badge hm">已确认</span>' : '<span class="badge warn">待人工确认</span>'}
    <div class="basis">${esc(a.basis || '（暂无 LLM 依据）')}</div>
    <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <select class="cat-sel">${sel}</select>
      <input type="text" class="sug-in" placeholder="修订建议（可选）" value="${esc(a.suggestion||'')}" style="flex:1;min-width:200px">
      <button class="btn-ok" data-act="confirm">确认 / 改标</button>
      <button class="btn-no" data-act="revert">驳回归因</button>
    </div>
    <div class="basis" style="margin-top:6px"><a href="/report.html?job=${esc(c.job_id)}" target="_blank">查看报告原文 →</a></div>
  </div>`;
}
async function load(){
  const q = filterQuery();
  const [listR, statsR] = await Promise.all([
    apiFetch('/api/badcases?' + q),
    apiFetch('/api/badcases/stats?' + (new URLSearchParams(q).get('job_id') ? 'job_id=' + new URLSearchParams(q).get('job_id') : '')),
  ]);
  const list = await listR.json();
  const stats = await statsR.json();
  STATS = stats;
  document.getElementById('statLine').textContent =
    `共 ${stats.total} 条（已确认 ${stats.confirmed}） | 待确认 ${stats.total - stats.confirmed}`;
  JOBS = Object.fromEntries((list.cases||[]).map(c=>[c.case_id, c]));
  if(!list.cases || !list.cases.length){
    document.getElementById('list').innerHTML = '<div class="empty">暂无 bad case（完成一次评测后自动产出）</div>';
  }else{
    document.getElementById('list').innerHTML = (list.cases||[]).map(c=>`
      <div class="case">
        <h3>${esc(c.task_id)} <span class="badge dim">${esc(c.dimension||'')}</span>
          <span class="badge" style="background:${CAT_COLORS[c.category]||'#30363d'};color:#0d1117">${esc(c.category)}</span></h3>
        <div class="meta">job: <a href="/report.html?job=${esc(c.job_id)}" target="_blank">${esc(c.job_id)}</a>
          · 得分 X=${c.score && c.score.x} / Y=${c.score && c.score.y}
          · 侧: ${esc(c.model==='x'?'答案X':c.model==='y'?'答案Y':'双侧')}</div>
        <div class="sources" style="margin-top:6px">${sourceBadges(c.sources)}</div>
        ${attrBlock(c)}
      </div>`).join('');
  }
  renderCharts(stats);
}
function renderCharts(stats){
  const catChart = echarts.init(document.getElementById('chartCat'));
  catChart.setOption({
    tooltip:{trigger:'item'},
    legend:{textStyle:{color:'#8b949e'},bottom:0},
    series:[{type:'pie', radius:'60%', center:['50%','45%'],
      label:{color:'#c9d1d9', fontSize:11},
      data:Object.entries(stats.by_category||{}).map(([k,v])=>({name:k, value:v, itemStyle:{color:CAT_COLORS[k]||'#8b949e'}}))}],
  });
  const srcChart = echarts.init(document.getElementById('chartSrc'));
  srcChart.setOption({
    tooltip:{trigger:'item'},
    legend:{textStyle:{color:'#8b949e'},bottom:0},
    series:[{type:'pie', radius:'60%', center:['50%','45%'],
      label:{color:'#c9d1d9', fontSize:11},
      data:Object.entries(stats.by_source||{}).map(([k,v])=>({name:SRC_LABELS[k]||k, value:v}))}],
  });
}
document.getElementById('list').addEventListener('click', async e=>{
  const btn = e.target.closest('button[data-act]');
  if(!btn) return;
  const block = btn.closest('.attr');
  const c = JOBS[block.dataset.id];
  const msg = document.createElement('div');
  msg.className = 'basis';
  try{
    const body = {category: btn.dataset.act === 'revert' ? null : block.querySelector('.cat-sel').value,
                  suggestion: block.querySelector('.sug-in').value.trim() || null};
    const r = await apiFetch(`/api/badcases/${c.case_id}/attribution`, {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || ('HTTP '+r.status));
    msg.textContent = (btn.dataset.act === 'revert' ? '已驳回归因 → ' : '已确认 → ') + d.category;
  }catch(err){ msg.textContent = '失败：' + err.message; }
  block.appendChild(msg);
  setTimeout(()=>{ msg.remove(); load(); }, 600);
});
document.getElementById('applyBtn').addEventListener('click', load);
document.getElementById('exportBtn').addEventListener('click', async ()=>{
  const job = document.getElementById('f-job').value.trim();
  const url = '/api/badcases/export' + (job ? '?job_id=' + encodeURIComponent(job) : '');
  try{
    const r = await apiFetch(url);
    if(!r.ok){
      const d = await r.json().catch(()=>({}));
      throw new Error(d.detail || ('HTTP '+r.status));
    }
    const blob = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = job ? `badcases-${job}.json` : 'badcases-all.json';
    a.click();
    URL.revokeObjectURL(a.href);
  }catch(e){ CD.toast('导出失败：' + e.message, 'err'); }
});
async function init(){
  const catsR = await apiFetch('/api/badcases/stats');
  const st = await catsR.json();
  CATS = st.categories || ['事实错误','语义错误','推理错误','安全偏见输出','执行错误','未归类'];
  document.getElementById('f-cat').innerHTML = '<option value="">全部</option>' +
    CATS.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  const params = new URLSearchParams(window.location.search);
  if(params.get('job')){
    document.getElementById('f-job').value = params.get('job');
    document.getElementById('subInfo').textContent = `job 筛选：${params.get('job')}`;
  }
  await load();
}
let CATS = [];
init().catch(e=>{ CD.renderError(document.getElementById('list'), '加载失败: '+(e.message||e), init); });
</script>
</body>
</html>
