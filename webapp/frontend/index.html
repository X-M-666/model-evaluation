<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型对决评测平台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.wrap{max-width:820px;margin:40px auto;padding:0 20px}
h1{font-size:28px;color:#58a6ff;margin-bottom:8px}
.sub{color:#8b949e;margin-bottom:30px;font-size:14px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:24px;margin-bottom:16px}
h2{font-size:18px;color:#58a6ff;margin-bottom:16px}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px;margin-top:14px}
input,select,textarea{width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:14px;font-family:inherit}
input:focus,textarea:focus{border-color:#58a6ff;outline:none}
.hint{font-size:12px;color:#8b949e;margin-top:3px}
.btn{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:15px;cursor:pointer;margin-top:18px}
.btn:hover{background:#2ea043}
.btn:disabled{background:#21262d;color:#484f58;cursor:not-allowed}
.btn-secondary{background:#30363d;color:#c9d1d9;border:1px solid #30363d}
.btn-secondary:hover{background:#484f58}
.btn-danger{background:transparent;color:#f85149;border:1px solid #f85149;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.btn-danger:hover{background:#da3633;color:#fff}
.btn-mock{background:#8957e5;color:#fff;border:none;border-radius:6px;padding:10px 20px;font-size:15px;cursor:pointer;margin-top:18px;margin-left:10px}
.btn-mock:hover{background:#a371f7}
.btn-upload{background:#1f6feb;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn-upload:hover{background:#388bfd}
.test-row{display:flex;gap:10px;align-items:center;margin-top:10px}
.test-ok{color:#3fb950;font-size:13px}
.test-err{color:#f85149;font-size:13px}
.progress{margin-top:12px;font-size:14px;color:#8b949e;display:none}
.spinner{display:inline-block;width:16px;height:16px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #21262d}
.history-row:last-child{border-bottom:none}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;background:#1f6feb;color:#fff}
.tag.pending{background:#da3633}
.tag.done{background:#238636}
.collapse-toggle{cursor:pointer;color:#58a6ff;font-size:13px;user-select:none;margin-top:14px}
.collapse-toggle:hover{text-decoration:underline}
.collapse-body{display:none;margin-top:10px;padding:12px;background:#0d1117;border:1px solid #30363d;border-radius:6px}
.collapse-body.open{display:block}
.param-row{display:flex;gap:12px;flex-wrap:wrap}
.param-row label{margin-top:0;flex:1;min-width:120px}
.param-row input{width:100%}
.dataset-section{margin-top:10px}
.radio-group label{display:inline;margin-right:20px;cursor:pointer;color:#c9d1d9;font-size:14px}
.radio-group input[type=radio]{margin-right:4px}
.dataset-list{margin-top:10px}
.ds-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;margin-bottom:6px}
.ds-item .ds-info{font-size:13px}
.ds-item .ds-info strong{color:#c9d1d9}
.ds-item .ds-info span{color:#8b949e;margin-left:8px}
textarea{min-height:120px;font-family:monospace;font-size:13px;resize:vertical}
</style>
</head>
<body>
<div class="wrap">
<h1>模型对决评测平台</h1>
<p class="sub">输入两个模型的 API 配置，自动出题、调用、双盲评审并展示对比报告</p>

<!-- 模型 A -->
<div class="card">
<h2>模型 A 配置</h2>
<label>API URL（OpenAI 兼容）</label>
<input id="a-url" placeholder="https://api.openai.com/v1" />
<label>API Key</label>
<input id="a-key" type="password" placeholder="sk-..." />
<label>模型名称</label>
<input id="a-name" placeholder="gpt-4o" />
<div class="collapse-toggle" onclick="toggleCollapse('params-a')">▶ 高级参数</div>
<div class="collapse-body" id="params-a">
  <div class="param-row">
    <label>Temperature<div class="hint">0-2，默认0.7</div><input id="a-temp" type="number" value="0.7" min="0" max="2" step="0.1"></label>
    <label>Max Tokens<div class="hint">最大生成长度</div><input id="a-tokens" type="number" value="4096" min="1" max="128000"></label>
    <label>Top P<div class="hint">留空=不设置</div><input id="a-topp" type="number" placeholder="留空" min="0" max="1" step="0.1"></label>
  </div>
</div>
</div>

<!-- 模型 B -->
<div class="card">
<h2>模型 B 配置</h2>
<label>API URL</label>
<input id="b-url" placeholder="https://api.anthropic.com/v1" />
<label>API Key</label>
<input id="b-key" type="password" placeholder="sk-..." />
<label>模型名称</label>
<input id="b-name" placeholder="claude-sonnet-4-20250514" />
<div class="collapse-toggle" onclick="toggleCollapse('params-b')">▶ 高级参数</div>
<div class="collapse-body" id="params-b">
  <div class="param-row">
    <label>Temperature<div class="hint">0-2，默认0.7</div><input id="b-temp" type="number" value="0.7" min="0" max="2" step="0.1"></label>
    <label>Max Tokens<div class="hint">最大生成长度</div><input id="b-tokens" type="number" value="4096" min="1" max="128000"></label>
    <label>Top P<div class="hint">留空=不设置</div><input id="b-topp" type="number" placeholder="留空" min="0" max="1" step="0.1"></label>
  </div>
</div>
</div>

<!-- 评测集 -->
<div class="card">
<h2>评测集</h2>
<div class="dataset-section">
  <div class="radio-group">
    <label><input type="radio" name="ds-mode" value="builtin" checked onchange="switchDatasetMode()"> 内置题库（七维度，每维度随机抽1题）</label>
    <label><input type="radio" name="ds-mode" value="custom" onchange="switchDatasetMode()"> 自定义评测集</label>
  </div>

  <!-- 内置题库选项 -->
  <div id="builtin-opts" style="margin-top:14px">
    <label>维度（默认全部七维度）</label>
    <div id="dims-box"></div>
    <label style="margin-top:14px">随机种子（可选，固定种子可复现题目）</label>
    <input id="seed" placeholder="留空自动" style="width:200px" />
  </div>

  <!-- 自定义评测集选项 -->
  <div id="custom-opts" style="display:none;margin-top:14px">
    <label>选择文件上传（JSON / CSV / Markdown / TXT）</label>
    <input type="file" id="ds-file" accept=".json,.csv,.md,.markdown,.txt" style="padding:6px 0" onchange="handleFileUpload()" />
    <div style="margin-top:6px;font-size:12px;color:#8b949e">
      格式参考：
      <a href="#" onclick="downloadTemplate('json');return false">JSON 模板</a> ·
      <a href="#" onclick="downloadTemplate('csv');return false">CSV 模板</a> ·
      <a href="#" onclick="downloadTemplate('md');return false">Markdown 模板</a> ·
      <a href="#" onclick="downloadTemplate('txt');return false">TXT 模板</a>
    </div>
    <label>或粘贴 JSON 到文本框</label>
    <textarea id="ds-json" placeholder='{"name":"我的测试集","tasks":[{"prompt":"题目","expected":"答案"}]}'></textarea>
    <button class="btn-upload" onclick="uploadJson()">上传文本框内容</button>
    <div id="upload-result" style="margin-top:8px;font-size:13px"></div>

    <label style="margin-top:16px">已有评测集</label>
    <div id="dataset-list" class="dataset-list"><em>加载中...</em></div>
    <div style="margin-top:10px">
      <label>选择评测集</label>
      <select id="ds-select"><option value="">（未选择）</option></select>
    </div>
  </div>
</div>
</div>

<!-- 重复评测 -->
<div class="card">
<h2>评测设置</h2>
<label>重复次数（>1 时自动跑 N 次取平均）</label>
<input id="repeat-n" type="number" value="1" min="1" max="20" style="width:120px" />
<span class="hint" style="margin-left:10px">稳定性测试建议设为 3~5</span>
</div>

<!-- 操作按钮 -->
<div class="test-row">
<button class="btn btn-secondary" id="testBtn" onclick="testConn()">验证连通性</button>
<span id="testResult"></span>
</div>
<div class="progress" id="progress">
<span class="spinner"></span>
<span id="progressText">准备中...</span>
</div>
<div>
<button class="btn" id="startBtn" onclick="startEval()">开始评测</button>
<button class="btn-mock" id="mockBtn" onclick="startMock()">测试结果案例</button>
</div>

<!-- 历史记录 -->
<div class="card" id="historyCard" style="margin-top:24px">
<h2>历史记录</h2>
<div id="historyList"><em>加载中...</em></div>
</div>
</div>

<script>
const API = '';
let dims = [];
let selectedDataset = '';

// ---- 初始化 ----
fetch(API+'/api/dims').then(r=>r.json()).then(d=>{
  dims = d.dims;
  const box = document.getElementById('dims-box');
  box.innerHTML = dims.map(dim=>`<label style="display:inline-block;margin-right:14px;margin-bottom:6px;cursor:pointer;color:#c9d1d9">
    <input type="checkbox" value="${dim}" checked style="margin-right:4px"> ${dim}
  </label>`).join('');
  loadHistory();
  loadDatasets();
});

// ---- 折叠切换 ----
function toggleCollapse(id){
  document.getElementById(id).classList.toggle('open');
}

// ---- 评测集模式切换 ----
function switchDatasetMode(){
  const mode = document.querySelector('input[name="ds-mode"]:checked').value;
  document.getElementById('builtin-opts').style.display = mode==='builtin' ? 'block' : 'none';
  document.getElementById('custom-opts').style.display = mode==='custom' ? 'block' : 'none';
}

function getSelectedDims(){
  const checks = document.querySelectorAll('#dims-box input[type=checkbox]:checked');
  const selected = Array.from(checks).map(c=>c.value);
  return selected.length === dims.length ? null : selected;
}

// ---- 数据集管理 ----
function loadDatasets(){
  fetch(API+'/api/datasets').then(r=>r.json()).then(d=>{
    const list = document.getElementById('dataset-list');
    const sel = document.getElementById('ds-select');
    if(!d.datasets||!d.datasets.length){
      list.innerHTML='<em>暂无自定义评测集</em>';
      sel.innerHTML='<option value="">（未选择）</option>';
      return;
    }
    list.innerHTML = d.datasets.map(ds=>`
      <div class="ds-item">
        <div class="ds-info">
          <strong>${esc(ds.name)}</strong>
          <span>${ds.task_count}题 · ${ds.dimensions.join(', ')}</span>
          ${ds.description ? '<span>'+esc(ds.description)+'</span>' : ''}
        </div>
        <button class="btn-danger" onclick="deleteDataset('${esc(ds.name)}')">删除</button>
      </div>
    `).join('');
    sel.innerHTML = '<option value="">（使用内置题库）</option>' +
      d.datasets.map(ds=>`<option value="${esc(ds.name)}">${esc(ds.name)} (${ds.task_count}题)</option>`).join('');
  });
}

async function handleFileUpload(){
  const file = document.getElementById('ds-file').files[0];
  if(!file) return;
  const form = new FormData();
  form.append('file', file);
  const res = document.getElementById('upload-result');
  res.innerHTML = '<span class="spinner"></span> 上传中...';
  try{
    const r = await fetch(API+'/api/datasets/upload', {method:'POST', body:form});
    const d = await r.json();
    if(d.ok){
      res.innerHTML = `<span class="test-ok">上传成功：${d.name}（${d.task_count}题，覆盖${d.dimensions.length}维度）</span>`;
      loadDatasets();
    } else {
      res.innerHTML = `<span class="test-err">上传失败: ${d.detail||JSON.stringify(d)}</span>`;
    }
  }catch(e){
    res.innerHTML = `<span class="test-err">上传失败: ${e}</span>`;
  }
}

async function uploadJson(){
  const content = document.getElementById('ds-json').value.trim();
  if(!content){ alert('请先粘贴 JSON 内容'); return; }
  const res = document.getElementById('upload-result');
  res.innerHTML = '<span class="spinner"></span> 解析中...';
  try{
    const r = await fetch(API+'/api/datasets/upload-json', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({content}),
    });
    const d = await r.json();
    if(d.ok){
      res.innerHTML = `<span class="test-ok">上传成功：${d.name}（${d.task_count}题）</span>`;
      document.getElementById('ds-json').value = '';
      loadDatasets();
    } else {
      res.innerHTML = `<span class="test-err">上传失败: ${d.detail||JSON.stringify(d)}</span>`;
    }
  }catch(e){
    res.innerHTML = `<span class="test-err">上传失败: ${e}</span>`;
  }
}

async function deleteDataset(name){
  if(!confirm(`确定删除评测集「${name}」？`)) return;
  await fetch(API+'/api/datasets/'+encodeURIComponent(name), {method:'DELETE'});
  loadDatasets();
}

// ---- 模板下载 ----
const TEMPLATES = {
  json: `{
  "name": "我的评测集",
  "description": "示例评测集",
  "tasks": [
    {
      "id": "T1",
      "dimension": "知识能力",
      "prompt": "太阳系中体积最大的行星是？",
      "expected": "木星"
    },
    {
      "id": "T2",
      "dimension": "推理能力",
      "prompt": "一个数加5后乘2等于14，这个数是？",
      "expected": "2"
    }
  ]
}`,
  csv: `id,dimension,prompt,expected,rubric_note,difficulty
T1,知识能力,太阳系中体积最大的行星是？,木星,,进阶
T2,推理能力,一个数加5后乘2等于14，这个数是？,2,,进阶`,
  md: `# 我的评测集
> 示例评测集

## 知识能力
### T1
**题目：** 太阳系中体积最大的行星是？
**期望：** 木星

## 推理能力
### T2
**题目：** 一个数加5后乘2等于14，这个数是？
**期望：** 2`,
  txt: `# 我的评测集
太阳系中体积最大的行星是？ | 木星
一个数加5后乘2等于14，这个数是？ | 2`,
};

function downloadTemplate(fmt){
  const ext = fmt==='markdown' ? 'md' : fmt;
  const content = TEMPLATES[ext];
  if(!content) return;
  const blob = new Blob([content], {type:'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `评测集模板.${ext}`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ---- 连通性测试 ----
async function testConn(){
  const btn = document.getElementById('testBtn');
  const res = document.getElementById('testResult');
  btn.disabled = true; res.innerHTML = '<span class="spinner"></span> 验证中...';
  const body = {
    model_a:{url:g('a-url'),key:g('a-key'),name:g('a-name'),temperature:0.7,max_tokens:4096},
    model_b:{url:g('b-url'),key:g('b-key'),name:g('b-name'),temperature:0.7,max_tokens:4096},
  };
  try{
    const r = await fetch(API+'/api/test-connection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const d = await r.json();
    let html = '';
    for(const[k,v] of Object.entries(d)){
      html += `<div class="${v.ok?'test-ok':'test-err'}">${k}: ${v.ok?'OK '+v.model:'FAIL '+v.error}</div>`;
    }
    res.innerHTML = html;
  }catch(e){
    res.innerHTML = `<div class="test-err">请求失败: ${e}</div>`;
  }
  btn.disabled = false;
}

// ---- 启动评测 ----
async function startEval(){
  const btn = document.getElementById('startBtn');
  const prog = document.getElementById('progress');
  const progText = document.getElementById('progressText');
  btn.disabled = true;
  prog.style.display = 'block';
  progText.textContent = '提交中...';

  const seed = document.getElementById('seed').value.trim();
  const dsMode = document.querySelector('input[name="ds-mode"]:checked').value;
  const dsName = dsMode === 'custom' ? document.getElementById('ds-select').value : null;

  const body = {
    model_a:{url:g('a-url'),key:g('a-key'),name:g('a-name'),
      temperature:parseFloat(g('a-temp'))||0.7, max_tokens:parseInt(g('a-tokens'))||4096,
      top_p:g('a-topp')?parseFloat(g('a-topp')):null},
    model_b:{url:g('b-url'),key:g('b-key'),name:g('b-name'),
      temperature:parseFloat(g('b-temp'))||0.7, max_tokens:parseInt(g('b-tokens'))||4096,
      top_p:g('b-topp')?parseFloat(g('b-topp')):null},
    dims: dsMode==='builtin' ? getSelectedDims() : null,
    seed: seed ? parseInt(seed) : null,
    dataset_name: dsName || null,
    repeat_n: parseInt(g('repeat-n')) || 1,
  };

  try{
    const r = await fetch(API+'/api/eval/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){
      const err = await r.json();
      throw new Error(err.detail || '请求失败');
    }
    const d = await r.json();
    const jobId = d.job_id;
    progText.textContent = `任务已创建: ${jobId}，连接实时进度...`;
    const evtSource = new EventSource(API+`/api/eval/${jobId}/events`);
    evtSource.onmessage = (e) => {
      const evt = JSON.parse(e.data);
      const round = evt.round ? `[${evt.round}] ` : '';
      if(evt.state==='executing') progText.textContent = `${round}模型调用中 ${evt.progress||''}`;
      else if(evt.state==='judging') progText.textContent = `${round}评审中...`;
      else if(evt.state==='completed'){
        progText.textContent = '完成，跳转报告页...';
        evtSource.close();
        setTimeout(()=>window.location='/report.html?job='+jobId, 600);
      }else if(evt.state==='error'){
        progText.textContent = '错误: '+evt.error;
        evtSource.close();
        btn.disabled = false;
      }
    };
    evtSource.onerror = ()=>{ progText.textContent = '连接断开，刷新查看状态'; evtSource.close(); btn.disabled=false; };
  }catch(e){
    progText.textContent = '提交失败: '+e.message;
    btn.disabled = false;
  }
}

// ---- 模拟评测 ----
async function startMock(){
  const btn = document.getElementById('mockBtn');
  btn.disabled = true; btn.textContent = '生成中...';
  try{
    const r = await fetch(API+'/api/eval/mock',{method:'POST'});
    const d = await r.json();
    window.location='/report.html?job='+d.job_id;
  }catch(e){
    alert('生成失败: '+e);
    btn.disabled = false; btn.textContent = '测试结果案例';
  }
}

function g(id){ return document.getElementById(id).value.trim(); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

// ---- 历史记录 ----
async function deleteJob(jobId){
  if(!confirm('确定要删除这条评测记录吗？此操作不可恢复。')) return;
  await fetch(API+'/api/history/'+jobId, {method:'DELETE'});
  loadHistory();
}

async function loadHistory(){
  try{
    const r = await fetch(API+'/api/history');
    const d = await r.json();
    const el = document.getElementById('historyList');
    if(!d.jobs||!d.jobs.length){ el.innerHTML='<em>暂无历史记录</em>'; return; }
    el.innerHTML = d.jobs.slice(0,10).map(j=>`
      <div class="history-row">
        <div>
          <span class="tag ${j.state==='completed'?'done':'pending'}">${j.state}</span>
          <strong>${esc(j.model_a)}</strong> vs <strong>${esc(j.model_b)}</strong>
          <span style="color:#8b949e;font-size:12px;margin-left:8px">${j.created_at.slice(0,16)}</span>
        </div>
        <div>
          <a href="/report.html?job=${j.job_id}" style="color:#58a6ff;text-decoration:none">查看</a>
          <button class="btn-danger" onclick="deleteJob('${j.job_id}')">删除</button>
        </div>
      </div>
    `).join('');
  }catch(e){}
}
</script>
</body>
</html>
