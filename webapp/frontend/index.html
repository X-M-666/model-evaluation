<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型对决评测平台</title>
<link rel="stylesheet" href="/static/common.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.hero{
  min-height:calc(100vh - 53px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(600px 300px at 20% 20%,rgba(88,166,255,.10),transparent 60%),
    radial-gradient(600px 300px at 80% 30%,rgba(240,136,62,.08),transparent 60%),
    radial-gradient(700px 400px at 50% 90%,rgba(46,160,67,.06),transparent 60%);
}
.hero .inner{position:relative;z-index:1;max-width:640px}
.logo{font-size:58px;line-height:1;margin-bottom:22px}
h1{font-size:38px;font-weight:700;color:#f0f6fc;letter-spacing:.5px}
h1 .accent{color:#58a6ff}
.tagline{font-size:15.5px;color:#8b949e;margin-top:14px;line-height:1.8}
.btn-main{
  display:inline-block;margin-top:38px;padding:14px 46px;font-size:17px;font-weight:600;
  color:#fff;background:linear-gradient(135deg,#1f6feb,#388bfd);
  border:none;border-radius:10px;cursor:pointer;text-decoration:none;
  box-shadow:0 4px 24px rgba(31,111,235,.35);transition:transform .15s ease,box-shadow .15s ease;
}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(31,111,235,.5)}
.btn-main:active{transform:translateY(0)}
.features{display:flex;gap:26px;justify-content:center;margin-top:34px;flex-wrap:wrap}
.features span{font-size:12.5px;color:#8b949e;background:#161b22;border:1px solid #30363d;border-radius:20px;padding:6px 14px}
.foot{position:absolute;bottom:16px;left:0;right:0;font-size:11.5px;color:#484f58;text-align:center;z-index:1}
</style>
</head>
<body>
<div class="hero">
  <div class="inner">
    <div class="logo">⚔️</div>
    <h1>模型对决<span class="accent">评测平台</span></h1>
    <p class="tagline">多模型同题对决 · 自动出题与评分 · 人工文本对战 · 扰动鲁棒性<br>排行榜对比报告 · 一站式模型评测工作台</p>
    <button id="enterBtn" class="btn-main">进入评测工作台 →</button>
    <div class="features">
      <span>评测任务</span><span>文本对战</span><span>排行榜</span>
      <span>扰动评测</span><span>LLM 出题</span><span>KPI 概览</span>
    </div>
  </div>
  <div class="foot">模型对决评测平台 · 本地部署 · 模型 Key 仅存内存不落盘</div>
</div>

<script src="/static/common.js"></script>
<script>
CD.renderTopNav('index');
document.getElementById('enterBtn').addEventListener('click', ()=>{
  window.location.href = '/tasks.html';
});
</script>
</body>
</html>
