<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>KPI 看板</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,'Segoe UI',sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:24px}
h1{font-size:22px;color:#f0f6fc}
h2{font-size:15px;color:#f0883e;margin-bottom:8px}
.sub{color:#8b949e;font-size:13px;margin-top:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-top:16px}
.hint{color:#8b949e;font-size:12px}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;background:#30363d}
.badge.ok{background:#238636;color:#fff}
.badge.no{background:#8b949e;color:#0d1117}
.chart{width:100%;height:320px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px;text-align:center}
.kpi .num{font-size:26px;color:#58a6ff;margin-top:6px}
.kpi .lbl{font-size:12px;color:#8b949e}
a{color:#58a6ff}
</style>
<script src="/static/echarts.min.js"></script>
</head>
<body>
<div class="wrap">
<h1>📊 KPI 看板</h1>
<p class="sub" id="subInfo">评测耗时 / Token 消耗趋势 + 硬件利用率（CPU 增量采样，GPU 无硬件 N/A）</p>

<div class="cards" id="kpiCards"></div>

<div class="card"><h2>评测耗时趋势（完成时间）</h2><div id="chartDur" class="chart"></div></div>
<div class="card"><h2>Token 消耗趋势</h2><div id="chartTok" class="chart"></div></div>

<div class="card">
<h2>硬件利用率</h2>
<div class="row" style="display:flex;gap:20px;flex-wrap:wrap;align-items:center">
  <div>
    <div class="hint">系统 CPU 利用率（增量采样）</div>
    <div style="font-size:30px;color:#3fb950" id="cpuVal">N/A</div>
  </div>
  <div>
    <div class="hint">GPU 利用率</div>
    <div style="font-size:30px;color:#8b949e">N/A</div>
  </div>
  <div class="hint" id="cpuNote" style="max-width:360px"></div>
</div>
</div>

<div class="card">
<h2>评测明细</h2>
<div id="jobTable"><div class="loading">加载中...</div></div>
</div>
</div>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getToken(){ return localStorage.getItem('duel_token') || ''; }
async function apiFetch(url, opts={}){
  const headers = Object.assign({}, opts.headers);
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if(r.status === 401) throw new Error('未授权：请在首页顶部设置访问令牌');
  return r;
}
let TIMER = null;
let LAST = null;

async function load(){
  const r = await apiFetch('/api/dashboard');
  const d = await r.json();
  renderKpis(d.jobs_trend || []);
  renderTrends(d.jobs_trend || []);
  renderHw(d.hw || {});
  renderJobs(d.jobs_trend || []);
}
function renderKpis(trend){
  const total = trend.length;
  const dur = trend.reduce((s,x)=>s+(x.duration_sec||0),0);
  const tok = trend.reduce((s,x)=>s+(x.total_tokens||0),0);
  document.getElementById('kpiCards').innerHTML = `
    <div class="kpi"><div class="lbl">已完成评测</div><div class="num">${total}</div></div>
    <div class="kpi"><div class="lbl">累计评测耗时（s）</div><div class="num">${Math.round(dur)}</div></div>
    <div class="kpi"><div class="lbl">累计 Token 消耗</div><div class="num">${tok.toLocaleString()}</div></div>
    <div class="kpi"><div class="lbl">有 KPI 数据</div><div class="num">${trend.filter(x=>x.duration_sec!=null).length}/${total}</div></div>`;
}
function renderTrends(trend){
  const sorted = trend.slice().sort((a,b)=>String(a.created_at||'').localeCompare(String(b.created_at||'')));
  const labels = sorted.map(x=>x.job_id);
  const dur = echarts.init(document.getElementById('chartDur'));
  dur.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis'},
    xAxis:{type:'category', data:labels, axisLabel:{color:'#8b949e', rotate:30}, splitLine:{lineStyle:{color:'#21262d'}}},
    yAxis:{type:'value', name:'秒', axisLabel:{color:'#8b949e'}, splitLine:{lineStyle:{color:'#21262d'}}},
    series:[{name:'耗时', type:'bar', itemStyle:{color:'#58a6ff'},
      data:sorted.map(x=>x.duration_sec==null?null:x.duration_sec)}],
  });
  const tok = echarts.init(document.getElementById('chartTok'));
  tok.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis'},
    xAxis:{type:'category', data:labels, axisLabel:{color:'#8b949e', rotate:30}, splitLine:{lineStyle:{color:'#21262d'}}},
    yAxis:{type:'value', name:'Token', axisLabel:{color:'#8b949e'}, splitLine:{lineStyle:{color:'#21262d'}}},
    series:[{name:'Token', type:'bar', itemStyle:{color:'#3fb950'},
      data:sorted.map(x=>x.total_tokens==null?null:x.total_tokens)}],
  });
}
function renderHw(hw){
  const cpu = hw.cpu || {};
  document.getElementById('cpuVal').textContent = cpu.percent==null ? 'N/A' : cpu.percent + '%';
  document.getElementById('cpuNote').textContent = cpu.note || '';
}
function renderJobs(trend){
  document.getElementById('jobTable').innerHTML = trend.length ? `
    <table style="width:100%;border-collapse:collapse;font-size:13px;margin-top:8px">
    <thead><tr><th>job</th><th>模型 A</th><th>模型 B</th><th>耗时(s)</th><th>Token</th><th>创建时间</th></tr></thead>
    <tbody>${trend.map(x=>`<tr>
      <td><a href="/report.html?job=${esc(x.job_id)}" target="_blank">${esc(x.job_id)}</a></td>
      <td>${esc(x.model_a||'')}</td><td>${esc(x.model_b||'')}</td>
      <td>${x.duration_sec==null?'<span class="badge no">N/A</span>':x.duration_sec}</td>
      <td>${x.total_tokens==null?'<span class="badge no">N/A</span>':x.total_tokens}</td>
      <td class="hint">${esc(x.created_at||'')}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">暂无已完成评测数据</div>';
}
async function init(){
  await load();
  TIMER = setInterval(load, 5000);  // CPU 增量采样需多次采样，5s 轮询刷新
}
init().catch(e=>{ document.getElementById('jobTable').innerHTML = '<div class="loading">加载失败: '+esc(e.message)+'</div>'; });
window.addEventListener('beforeunload', ()=>{ if(TIMER) clearInterval(TIMER); });
</script>
</body>
</html>
