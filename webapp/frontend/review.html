<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人工双盲评审 - 模型对决</title>
<link rel="stylesheet" href="/static/common.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#c9d1d9;min-height:100vh}
.wrap{max-width:1100px;margin:30px auto;padding:0 20px}
h1{font-size:24px;color:#58a6ff;margin-bottom:6px}
.sub{color:#8b949e;font-size:14px;margin-bottom:20px}
a{color:#58a6ff;text-decoration:none}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px;margin-bottom:16px}
h2{font-size:17px;color:#58a6ff;margin-bottom:12px}
h3{font-size:15px;color:#c9d1d9;margin-bottom:8px}
.round-banner{background:#1c2128;border:1px solid #30363d;border-radius:8px;padding:12px 16px;margin-bottom:16px;font-size:14px;color:#8b949e}
.answer-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:800px){.answer-grid{grid-template-columns:1fr}}
.answer-box{background:#0d1117;border:1px solid #30363d;border-radius:8px;padding:14px}
.answer-box .label{font-size:13px;font-weight:bold;margin-bottom:10px}
.answer-box .label.x{color:#58a6ff}
.answer-box .label.y{color:#f0883e}
.answer-box pre{white-space:pre-wrap;word-break:break-word;font-size:13px;font-family:inherit;color:#c9d1d9;line-height:1.6}
.answer-box .meta{font-size:11px;color:#8b949e;margin-top:10px;border-top:1px solid #21262d;padding-top:8px}
.answer-box .code-verify{margin-top:8px;font-size:12px}
.runs{margin-top:8px;font-size:12px;color:#8b949e;border-top:1px dashed #30363d;padding-top:8px}
.runs .run{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px;margin-top:6px;white-space:pre-wrap;font-size:12px}
.score-row{display:flex;gap:24px;margin-top:14px;align-items:flex-end;flex-wrap:wrap}
.score-field label{display:block;font-size:12px;color:#8b949e;margin-bottom:4px}
.score-field input{width:110px;padding:8px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:16px;text-align:center}
.score-field input:focus{border-color:#58a6ff;outline:none}
.score-field input.warn{border-color:#f85149}
.note-field{flex:1;min-width:220px}
.note-field input{width:100%;padding:8px 10px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px}
.rubric{margin-top:12px;padding:10px 12px;background:#1c2128;border-left:3px solid #58a6ff;border-radius:0 6px 6px 0;font-size:13px;color:#8b949e;line-height:1.6;white-space:pre-wrap}
.test-cases{margin-top:10px;font-size:12px;color:#8b949e}
.test-cases .tc{margin-top:4px}
.sticky-bar{position:sticky;bottom:0;background:#0d1117;border-top:1px solid #30363d;padding:12px 0;margin-top:8px;display:flex;align-items:center;gap:16px}
.progress-text{font-size:13px;color:#8b949e;flex:1}
.btn{background:#238636;color:#fff;border:none;border-radius:6px;padding:10px 22px;font-size:15px;cursor:pointer}
.btn:hover{background:#2ea043}
.btn:disabled{background:#21262d;color:#484f58;cursor:not-allowed}
.btn-secondary{background:#30363d;color:#c9d1d9;border:1px solid #30363d}
.btn-secondary:hover{background:#484f58}
.loading{text-align:center;padding:60px;color:#8b949e}
.blind-note{background:#1c2128;border:1px solid #30363d;border-radius:8px;padding:14px 18px;margin-bottom:20px;font-size:13px;color:#8b949e;line-height:1.7}
.blind-note strong{color:#f0883e}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px}
.badge.dim{background:#1f6feb;color:#fff}
.badge.lv{background:#30363d;color:#8b949e}
.badge.err{background:#da3633;color:#fff}
</style>
</head>
<body>
<div class="wrap">
<h1>🧑‍⚖️ 人工双盲评审</h1>
<p class="sub" id="subInfo">加载中...</p>
<div style="margin-bottom:16px"><a href="/">← 返回配置</a></div>

<div class="blind-note" id="blindNote">
  <strong>双盲规则</strong>：以下是两个被测模型的回答，已随机打乱为 <strong>答案X</strong> 与 <strong>答案Y</strong>，你不知道它们各自对应哪个模型。
  请依据每题给出的评分标准（rubric）独立打分：每题为 X、Y 各评 0-10 分（支持 0.5 步长），可选填评语。
  打分过程中不要尝试猜测模型身份；提交后系统将揭示对应关系并生成报告。
</div>

<div class="blind-note" id="hybridNote" style="display:none;border-color:#8957e5;background:rgba(137,87,229,.08)">
  <strong>Hybrid 复核</strong>：AI 评审已完成全部题目，本页仅列出需人工复核的 Top-K 题（无效评审必选）。
  每题显示 AI 原分供参考，<strong style="color:#f0883e">复核提交后将用你的打分覆盖该题的 AI 分</strong>，其余题目保留 AI 评审结果。
</div>

<div id="content"><div class="loading">加载评审数据...</div></div>

<div class="sticky-bar" id="stickyBar" style="display:none">
  <span class="progress-text" id="progressText"></span>
  <button class="btn" id="submitBtn" disabled>提交评审</button>
</div>
</div>

<script src="/static/common.js"></script>
<script>
CD.renderTopNav();
const params = new URLSearchParams(window.location.search);
const jobId = params.get('job');
let DATA = null;
const DRAFT_KEY = 'review-draft-' + jobId;

function getToken(){ return CD.getToken(); }
async function apiFetch(url, opts={}){ return CD.apiFetch(url, opts); }

if(!jobId){
  document.getElementById('content').innerHTML='<div class="loading">缺少 job 参数，<a href="/">返回首页</a></div>';
}else{
  loadReview();
}

async function loadReview(){
  try{
    const r = await apiFetch(`/api/eval/${jobId}/review`);
    if(!r.ok) throw new Error((await r.json()).detail || '加载失败');
    DATA = await r.json();
    render();
  }catch(e){
    CD.renderError(document.getElementById('content'), '加载失败: '+(e.message||e), loadReview);
  }
}

function render(){
  const sub = `任务: ${DATA.total_questions} 题 | 轮次: ${DATA.repeat_n} | jobId: ${jobId}`;
  document.getElementById('subInfo').textContent = sub;
  const isHybrid = !!DATA.hybrid;
  document.getElementById('hybridNote').style.display = isHybrid ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = isHybrid ? '提交复核' : '提交评审';
  const reviewKeys = new Set();
  let agentScores = {};
  if(isHybrid){
    (DATA.hybrid.review_set || []).forEach(it=>{
      reviewKeys.add(it.round + ':' + it.task_id);
      agentScores[it.round + ':' + it.task_id] = it;
    });
  }
  const content = document.getElementById('content');
  let html = '';
  DATA.rounds.forEach((round, ri) => {
    if(DATA.repeat_n > 1){
      html += `<div class="round-banner">第 ${round.round}/${DATA.repeat_n} 轮</div>`;
    }
    round.items.forEach((item, qi) => {
      const gi = globalIndex(ri, qi);
      const rk = round.round + ':' + item.id;
      if(isHybrid && !reviewKeys.has(rk)) return;  // hybrid 复核态仅渲染复核题
      const agent = agentScores[rk];
      const agentBadge = agent ? `<span class="badge dim" style="background:#8957e5" title="AI 预评分（提交后将被覆盖）">AI: X ${agent.agent_x} / Y ${agent.agent_y}${agent.invalid ? '（无效，需复核）' : ''}</span>` : '';
      const prefillX = isHybrid && agent ? agent.agent_x : draftScore(ri,qi,'x');
      const prefillY = isHybrid && agent ? agent.agent_y : draftScore(ri,qi,'y');
      html += `<div class="card q-card" data-ri="${ri}" data-qi="${qi}">
        <h3>${esc(item.id)} <span class="badge dim">${esc(item.dimension)}</span>
          <span class="badge lv">${esc(item.difficulty||'')}</span> ${agentBadge}</h3>
        <div style="font-size:13px;color:#8b949e;margin-top:6px;white-space:pre-wrap">${esc(item.prompt)}</div>
        ${item.context ? `<div class="rubric" style="border-left-color:#3fb950"><strong>📄 参考文档</strong>（题目携带，供核对答案忠实性）\n${esc(item.context)}</div>` : ''}
        ${item.rubric_note ? `<div class="rubric">📋 ${esc(item.rubric_note)}</div>` : ''}
        ${item.test_cases && item.test_cases.length ? `<div class="test-cases"><strong>测试用例参考：</strong>${item.test_cases.map(tc=>`<div class="tc">· ${esc(tc.input)} → ${esc(tc.expected)}</div>`).join('')}</div>` : ''}
        <div class="answer-grid">
          ${answerBox('答案X', item.answer_x, 'x')}
          ${answerBox('答案Y', item.answer_y, 'y')}
        </div>
        <div class="score-row">
          <div class="score-field"><label>答案X 得分 (0-10)</label><input type="number" min="0" max="10" step="0.5" data-field="x" data-ri="${ri}" data-qi="${qi}" value="${prefillX}" /></div>
          <div class="score-field"><label>答案Y 得分 (0-10)</label><input type="number" min="0" max="10" step="0.5" data-field="y" data-ri="${ri}" data-qi="${qi}" value="${prefillY}" /></div>
          <div class="score-field note-field"><label>评语（可选）</label><input type="text" placeholder="简要说明评分依据..." data-field="note" data-ri="${ri}" data-qi="${qi}" value="${esc(draftNote(ri,qi))}" /></div>
        </div>
      </div>`;
    });
  });
  content.innerHTML = html;
  document.getElementById('stickyBar').style.display = 'flex';
  updateProgress();
  attachListeners();
  if(DATA.submitted){
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.textContent = '评审已提交，查看报告';
    btn.onclick = ()=>window.location='/report.html?job='+jobId;
  }
}

function answerBox(label, ans, side){
  const statusBadge = ans.status === 'ok' ? '' : `<span class="badge err">调用失败</span>`;
  let runsHtml = '';
  if(ans.repeat_runs && ans.repeat_runs.length > 1){
    runsHtml = `<div class="runs">两次运行（稳定性校验）：${ans.repeat_runs.map((r,i)=>`<div class="run"><strong>第${i+1}次：</strong>${esc(r)||'(空)'}</div>`).join('')}</div>`;
  }
  const cv = ans.code_verify;
  const cvText = cv
    ? (cv.status==='run' ? `代码验真 ${cv.passed}/${cv.total} 用例通过` : (cv.status==='error' ? '代码验真执行异常（可能已部分执行）' : '代码验真未执行'))
    : '代码验真未执行';
  const cvClass = cv ? (cv.status==='run' ? (cv.passed===cv.total?'dim':'err') : (cv.status==='error' ? 'err' : 'dim')) : 'dim';
  const cvHtml = cv ? `<div class="code-verify"><span class="badge ${cvClass}">${cvText}</span></div>` : '';
  return `<div class="answer-box">
    <div class="label ${side}">${label} ${statusBadge}</div>
    <pre>${esc(ans.raw_answer||'(无回答)')}</pre>
    ${runsHtml}
    ${cvHtml}
    <div class="meta">延迟 ${ans.latency_ms} ms · prompt ${ans.prompt_tokens} tokens · completion ${ans.completion_tokens} tokens${ans.truncated?' · <span style="color:#f85149">输出截断</span>':''}</div>
  </div>`;
}

function globalIndex(ri, qi){
  let idx = 0;
  for(let i = 0; i < ri; i++) idx += DATA.rounds[i].items.length;
  return idx + qi;
}

function attachListeners(){
  document.querySelectorAll('.score-field input[data-field]').forEach(inp=>{
    inp.addEventListener('input', saveDraft);
    inp.addEventListener('blur', validateField);
  });
}

function validateField(e){
  const v = parseFloat(e.target.value);
  const field = e.target.dataset.field;
  if(field === 'note') return;
  if(isNaN(v) || v < 0 || v > 10){
    e.target.classList.add('warn');
  }else{
    e.target.classList.remove('warn');
  }
}

function draftScore(ri, qi, field){
  const d = loadDraft();
  return d[globalIndex(ri,qi)] ? (d[globalIndex(ri,qi)][field] ?? '') : '';
}
function draftNote(ri, qi){
  const d = loadDraft();
  return d[globalIndex(ri,qi)] ? (d[globalIndex(ri,qi)]['note'] || '') : '';
}

function loadDraft(){
  try{ return JSON.parse(localStorage.getItem(DRAFT_KEY) || '{}'); }catch(e){ return {}; }
}
function saveDraft(){
  const d = {};
  document.querySelectorAll('.q-card').forEach(card=>{
    const ri = parseInt(card.dataset.ri), qi = parseInt(card.dataset.qi);
    const idx = globalIndex(ri, qi);
    const x = card.querySelector('input[data-field="x"]').value;
    const y = card.querySelector('input[data-field="y"]').value;
    const note = card.querySelector('input[data-field="note"]').value;
    d[idx] = {round: ri+1, x, y, note};
  });
  localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  updateProgress();
}

function updateProgress(){
  let filled = 0, total = 0;
  document.querySelectorAll('.q-card').forEach(card=>{
    const x = card.querySelector('input[data-field="x"]');
    const y = card.querySelector('input[data-field="y"]');
    total++;
    const xv = parseFloat(x.value), yv = parseFloat(y.value);
    if(!isNaN(xv) && xv >= 0 && xv <= 10 && !isNaN(yv) && yv >= 0 && yv <= 10) filled++;
  });
  document.getElementById('progressText').textContent = `已评分 ${filled}/${total} 题（草稿自动保存在本机浏览器，刷新不丢失）`;
  document.getElementById('submitBtn').disabled = filled < total;
}

async function submitReview(){
  const scores = [];
  let valid = true;
  document.querySelectorAll('.q-card').forEach(card=>{
    const ri = parseInt(card.dataset.ri);
    const item = DATA.rounds[ri].items[parseInt(card.dataset.qi)];
    const x = parseFloat(card.querySelector('input[data-field="x"]').value);
    const y = parseFloat(card.querySelector('input[data-field="y"]').value);
    const note = card.querySelector('input[data-field="note"]').value.trim();
    if(isNaN(x) || isNaN(y) || x < 0 || x > 10 || y < 0 || y > 10){ valid = false; return; }
    scores.push({id: item.id, round: ri+1, answer_x: x, answer_y: y, note});
  });
  if(!valid){ CD.toast('存在无效分数（应为 0-10），请检查红色标记的输入框', 'warn'); return; }

  const isHybrid = !!DATA.hybrid;
  const endpoint = isHybrid ? `/api/eval/${jobId}/hybrid-review` : `/api/eval/${jobId}/review`;
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '提交中...';
  try{
    const r = await apiFetch(endpoint, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({scores}),
    });
    if(!r.ok){
      const err = await r.json();
      const msg = typeof err.detail === 'object' && err.detail
        ? (err.detail.message || '提交失败') : (err.detail || '提交失败');
      throw new Error(msg);
    }
    btn.textContent = '已提交，正在生成报告...';
    localStorage.removeItem(DRAFT_KEY);
    setTimeout(()=>window.location='/report.html?job='+jobId, 500);
  }catch(e){
    CD.toast('提交失败: ' + e.message, 'err');
    btn.disabled = false; btn.textContent = '重新提交';
  }
}

function esc(s){ return CD.esc(s); }

document.getElementById('submitBtn').addEventListener('click', submitReview);
</script>
</body>
</html>
