<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对抗扰动评测</title>
<style>
body{background:#0d1117;color:#c9d1d9;font-family:-apple-system,'Segoe UI',sans-serif;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:24px}
h1{font-size:22px;color:#f0f6fc}
h2{font-size:15px;color:#f0883e;margin-bottom:8px}
.sub{color:#8b949e;font-size:13px;margin-top:6px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px;margin-top:16px}
.hint{color:#8b949e;font-size:12px}
label{display:block;font-size:13px;color:#8b949e;margin-bottom:4px;margin-top:12px}
input,select,textarea{width:100%;padding:8px 12px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:13px;box-sizing:border-box}
button{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.btn{background:#238636;color:#fff}
.btn-ghost{background:#30363d;color:#c9d1d9}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;margin-left:6px;background:#30363d}
.badge.ok{background:#238636;color:#fff}
.badge.run{background:#1f6feb;color:#fff}
.badge.err{background:#da3633;color:#fff}
.badge.warn{background:#f0883e;color:#0d1117}
.badge.lm{background:#8957e5;color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row label{flex:1;min-width:220px}
.modes{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.modes label{display:inline-flex;align-items:center;gap:4px;margin:0;font-size:13px;color:#c9d1d9;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:6px 10px;cursor:pointer}
.chart{width:100%;height:340px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{padding:6px 10px;border-bottom:1px solid #21262d;text-align:left}
th{color:#8b949e;font-weight:normal}
a{color:#58a6ff}
.loading{text-align:center;padding:40px;color:#8b949e}
.empty{text-align:center;padding:40px;color:#8b949e}
.hist-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #21262d;cursor:pointer}
.hist-item:hover{background:#0d1117}
.warn-item{font-size:12px;color:#f0883e;padding:4px 0}
</style>
<script src="/static/echarts.min.js"></script>
</head>
<body>
<div class="wrap">
<h1>⚔️ 对抗扰动评测</h1>
<p class="sub" id="subInfo">对抗样本生成（改写 / 噪声注入 / 属性扰动）→ 单模型作答 → 鲁棒性衰减曲线与偏见公平性对照</p>

<div class="card">
<h2>评测配置</h2>
<div class="row">
  <label>被测模型配置库
    <select id="libSel"><option value="">（手动填写下方字段）</option></select>
  </label>
  <label>API URL <input id="m-url" placeholder="https://api.example.com/v1"></label>
  <label>模型名称 <input id="m-name" placeholder="如 gpt-4o"></label>
  <label>API Key（仅内存，不落盘） <input id="m-key" type="password"></label>
</div>
<div class="row">
  <label>温度 <input id="m-temp" type="number" step="0.1" min="0" max="2" value="0.7"></label>
  <label>max_tokens <input id="m-max" type="number" min="1" value="4096"></label>
  <label>评测集
    <select id="dsSel"></select>
  </label>
  <label>随机种子 <input id="seed" type="number" placeholder="缺省=随机"></label>
</div>
<div style="margin-top:12px"><span class="hint">扰动模式：</span>
  <div class="modes" id="modeBox"></div>
</div>
<div class="row">
  <label>单臂评审模型 URL（生成式题打分，可留空）
    <input id="j-url" placeholder="留空=生成式题得分 N/A">
  </label>
  <label>评审模型名称 <input id="j-name" placeholder="如 gpt-4o"></label>
  <label>评审 API Key <input id="j-key" type="password"></label>
</div>
<button class="btn" id="runBtn" style="margin-top:16px">开始扰动评测</button>
<span class="hint" id="runMsg"></span>
</div>

<div class="card">
<h2>历史扰动评测</h2>
<div id="histList"><div class="empty">暂无记录</div></div>
</div>

<div class="card" id="resultCard" style="display:none">
<h2>结果视图 <span id="stateBadge" class="badge"></span></h2>
<p class="sub" id="resSub"></p>
<div class="card" style="margin-top:12px"><h2>鲁棒性衰减曲线（扰动强度 → 平均得分）</h2><div id="chartCurve" class="chart"></div></div>
<div class="card" style="margin-top:12px"><h2>偏见与公平性对照（属性扰动）</h2>
  <p class="hint" id="biasSummary"></p>
  <div id="biasTable"><div class="empty">无属性扰动对照数据</div></div>
</div>
<div class="card" style="margin-top:12px"><h2>逐题明细</h2><div id="taskTable"></div></div>
<div class="card" style="margin-top:12px"><h2>提示与警告</h2><div id="warnBox"></div></div>
</div>
</div>

<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getToken(){ return localStorage.getItem('duel_token') || ''; }
async function apiFetch(url, opts={}){
  const headers = Object.assign({}, opts.headers);
  const token = getToken();
  if(token) headers['Authorization'] = 'Bearer ' + token;
  const r = await fetch(url, Object.assign({}, opts, {headers}));
  if(r.status === 401) throw new Error('未授权：请在首页顶部设置访问令牌');
  return r;
}
const MODES = [
  {key:'改写', label:'改写（同义词替换）'},
  {key:'噪声注入', label:'噪声注入（10%/20%/30%）'},
  {key:'属性扰动-性别', label:'属性扰动·性别'},
  {key:'属性扰动-地域', label:'属性扰动·地域'},
  {key:'属性扰动-文化', label:'属性扰动·文化'},
];
const STATE_BADGE = {running:'<span class="badge run">运行中</span>', ready:'<span class="badge ok">完成</span>',
  error:'<span class="badge err">失败</span>', partial:'<span class="badge warn">部分（中断）</span>'};
let POLL = null;
let CURRENT = null;

function modeBox(){
  document.getElementById('modeBox').innerHTML = MODES.map(m=>
    `<label><input type="checkbox" value="${m.key}" ${['改写','噪声注入','属性扰动-地域'].includes(m.key)?'checked':''}> ${esc(m.label)}</label>`).join('');
}
function modelPayload(prefix){
  return {
    url: document.getElementById(prefix+'-url').value.trim(),
    key: document.getElementById(prefix+'-key').value.trim() || null,
    name: document.getElementById(prefix+'-name').value.trim() || 'unnamed',
    temperature: parseFloat(document.getElementById(prefix+'-temp')?.value || '0.7') || 0.7,
    max_tokens: parseInt(document.getElementById(prefix+'-max')?.value || '4096') || 4096,
  };
}
async function loadLib(){
  const r = await apiFetch('/api/models');
  const list = ((await r.json()).models) || [];
  document.getElementById('libSel').innerHTML = '<option value="">（手动填写下方字段）</option>' +
    list.map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('');
}
async function loadDatasets(){
  const r = await apiFetch('/api/datasets');
  const list = ((await r.json()).datasets) || [];
  document.getElementById('dsSel').innerHTML = list.map(d=>
    `<option value="${esc(d.name)}">${esc(d.name)}（${d.task_count} 题）</option>`).join('');
}
async function onLibPick(){
  const id = document.getElementById('libSel').value;
  if(!id) return;
  const r = await apiFetch('/api/models/' + id);
  const m = await r.json();
  if(m && m.url){
    document.getElementById('m-url').value = m.url || '';
    document.getElementById('m-name').value = m.name || '';
    document.getElementById('m-temp').value = m.temperature || 0.7;
    document.getElementById('m-max').value = m.max_tokens || 4096;
    if(m.key) document.getElementById('m-key').value = m.key;
    document.getElementById('libSel').closest('.row').querySelector('.hint').textContent =
      m.has_key ? '已从配置库填入（含内存 Key）' : '该配置未补录 Key，请手动填写';
  }
}
async function run(){
  const modes = Array.from(document.querySelectorAll('#modeBox input:checked')).map(i=>i.value);
  if(!modes.length){ document.getElementById('runMsg').textContent = '请至少选择一种扰动模式'; return; }
  const model = modelPayload('m');
  if(!model.url){ document.getElementById('runMsg').textContent = '请填写被测模型 API URL'; return; }
  const judge = (document.getElementById('j-url').value.trim() || document.getElementById('j-key').value.trim())
    ? modelPayload('j') : null;
  const body = {
    model, modes,
    dataset_name: document.getElementById('dsSel').value,
    seed: document.getElementById('seed').value ? parseInt(document.getElementById('seed').value) : null,
    judge,
  };
  document.getElementById('runMsg').textContent = '提交中...';
  try{
    const r = await apiFetch('/api/perturb', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || ('HTTP '+r.status));
    document.getElementById('runMsg').textContent = '已创建：' + d.perturb_id;
    openDetail(d.perturb_id);
  }catch(e){ document.getElementById('runMsg').textContent = '失败：' + e.message; }
}
async function loadHist(){
  const r = await apiFetch('/api/perturb');
  const list = (await r.json()).perturbs || [];
  document.getElementById('histList').innerHTML = list.length ? list.map(p=>`
    <div class="hist-item" data-id="${esc(p.perturb_id)}">
      <div><strong>${esc(p.perturb_id)}</strong> · ${esc(p.model)} · 数据集 ${esc(p.dataset)} · 模式 ${esc((p.modes||[]).join('/'))}
        <div class="hint">${esc(p.created_at||'')} · ${esc(p.progress||'')}</div></div>
      <div>${STATE_BADGE[p.state]||'<span class="badge">'+esc(p.state)+'</span>'}</div>
    </div>`).join('') : '<div class="empty">暂无记录，先在上方提交一次扰动评测</div>';
}
async function openDetail(id){
  if(POLL) clearInterval(POLL);
  const r = await apiFetch('/api/perturb/' + id);
  const d = await r.json();
  render(d);
  if(d.state === 'running'){
    POLL = setInterval(async ()=>{
      const rr = await apiFetch('/api/perturb/' + id);
      const dd = await rr.json();
      render(dd);
      if(dd.state !== 'running' && POLL){ clearInterval(POLL); POLL = null; }
    }, 2000);
  }
}
function render(d){
  CURRENT = d;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('stateBadge').innerHTML = STATE_BADGE[d.state] || d.state;
  document.getElementById('resSub').textContent =
    `模型 ${d.model_name} · 数据集 ${d.dataset} · 进度 ${d.progress||''}${d.error ? ' · 错误：' + d.error : ''}`;
  renderCurves(d.curves || {});
  renderBias(d.bias || {});
  renderTasks(d.per_task || []);
  renderWarns(d.warnings || []);
  loadHist();
}
function renderCurves(curves){
  const c = curves.curves || {};
  const chart = echarts.init(document.getElementById('chartCurve'));
  const series = Object.entries(c).map(([mode, data])=>({
    name: mode, type: 'line', smooth: true, symbolSize: 7,
    data: (data.intensities||[]).map((iv, i)=>({value: [iv, data.scores[i]], n: data.n_tasks[i]})),
  }));
  chart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'axis', formatter: p=>p.map(x=>`${x.marker} ${x.seriesName}<br>强度 ${x.value[0]} → 得分 ${x.value[1]}（题数 ${x.value[2]}）`).join('<br>')},
    legend:{textStyle:{color:'#8b949e'}, top:0},
    xAxis:{type:'value', name:'扰动强度', axisLabel:{color:'#8b949e'}, splitLine:{lineStyle:{color:'#21262d'}}},
    yAxis:{type:'value', name:'平均得分', min:0, max:10, axisLabel:{color:'#8b949e'}, splitLine:{lineStyle:{color:'#21262d'}}},
    series,
  });
}
function renderBias(bias){
  const pairs = bias.pairs || [];
  document.getElementById('biasSummary').textContent = pairs.length
    ? `共 ${pairs.length} 组属性扰动对照 · 潜在歧视 ${bias.n_flagged||0} 组（|分差|≥${bias.threshold}）`
    : '无属性扰动对照数据（所选模式不含属性扰动或无槽位命中）';
  document.getElementById('biasTable').innerHTML = pairs.length ? `
    <table><thead><tr><th>题目</th><th>模式</th><th>原版分</th><th>扰动分</th><th>分差</th><th>一致性</th><th>判定</th></tr></thead>
    <tbody>${pairs.map(p=>`
      <tr><td>${esc(p.task_id)}</td><td>${esc(p.mode)}</td>
        <td>${p.score_original==null?'N/A':p.score_original}</td>
        <td>${p.score_perturbed==null?'N/A':p.score_perturbed}</td>
        <td>${p.diff==null?'N/A':p.diff}</td>
        <td>${p.consistency==null?'N/A':p.consistency}</td>
        <td>${p.discriminates?'<span class="badge err">疑似歧视</span>':'<span class="badge ok">无显著差异</span>'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">无属性扰动对照数据</div>';
}
function renderTasks(rows){
  document.getElementById('taskTable').innerHTML = rows.length ? `
    <table><thead><tr><th>任务</th><th>来源</th><th>模式</th><th>强度</th><th>得分</th><th>延迟(ms)</th><th>Token</th><th>答案摘要</th></tr></thead>
    <tbody>${rows.map(r=>`
      <tr><td>${esc(r.task_id)}</td><td>${esc(r.origin_id)}</td><td>${esc(r.mode)}</td>
        <td>${r.intensity}</td><td>${r.score==null?'<span class="badge warn">N/A</span>':r.score}</td>
        <td>${r.latency_ms==null?'-':r.latency_ms}</td><td>${r.tokens==null?'-':r.tokens}</td>
        <td>${esc((r.raw_answer||'').slice(0,80))||'-'}</td></tr>`).join('')}
    </tbody></table>` : '<div class="empty">暂无数据</div>';
}
function renderWarns(warns){
  document.getElementById('warnBox').innerHTML = warns.length
    ? warns.map(w=>`<div class="warn-item">⚠ ${esc(w.code)}：${esc(w.message)}${w.task_id?'（题 '+esc(w.task_id)+'）':''}</div>`).join('')
    : '<div class="empty">无警告</div>';
}
document.getElementById('runBtn').addEventListener('click', run);
document.getElementById('libSel').addEventListener('change', onLibPick);
document.getElementById('histList').addEventListener('click', e=>{
  const item = e.target.closest('.hist-item');
  if(item) openDetail(item.dataset.id);
});
modeBox();
loadLib().catch(()=>{});
loadDatasets().catch(()=>{});
loadHist().catch(e=>{ document.getElementById('histList').innerHTML = '<div class="loading">加载失败: '+esc(e.message)+'</div>'; });
const params = new URLSearchParams(window.location.search);
if(params.get('id')) openDetail(params.get('id'));
</script>
</body>
</html>
