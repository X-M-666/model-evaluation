name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest + coverage (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Configure sandbox runtime path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $py = (python -c "import sys; print(sys.executable)")
          echo "MODEL_DUEL_SANDBOX_PYTHON=$py" >> $env:GITHUB_ENV
      - name: Isolation runtime selfcheck (Windows)
        if: runner.os == 'Windows'
        run: python -m scripts.sandbox_selfcheck
      - name: Run tests with coverage (Linux/macOS: common tests only)
        if: runner.os != 'Windows'
        run: python -m pytest tests -q --cov=backend --cov-report=term-missing -m "not native"
      - name: Run tests with coverage (Windows: full suite incl. native sandbox)
        if: runner.os == 'Windows'
        run: python -m pytest tests -q --cov=backend --cov-report=term-missing
